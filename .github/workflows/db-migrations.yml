name: Database Migrations CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-dry-run:
    name: Validate SQL, Reset Local DB & Dry-Run
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Static SQL Safety Check & Squawk Lint
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*.sql)
          if [ ${#migrations[@]} -eq 0 ]; then
            echo "No SQL migration files found under supabase/migrations/."
            exit 1
          fi

          if grep -nE '(\bTRUNCATE\b|TU_PROJECT_REF|TU_SERVICE_ROLE_KEY)' "${migrations[@]}"; then
            echo "::error::Destructive TRUNCATE or unreplaced placeholder token detected in migrations."
            exit 1
          fi

          npx --yes squawk-cli \
            --exclude=prefer-robust-stmts,prefer-text-field,prefer-identity,require-concurrent-index-creation \
            "${migrations[@]}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Ephemeral DB Reset, Lint & pgTAP Tests
        run: |
          set -euo pipefail
          supabase start -x studio,mailpit,logflare,vector,imgproxy,edge-runtime
          supabase db reset --local
          supabase db lint --local --level error --fail-on error
          supabase test db --local

      - name: Production Migration Dry-Run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            {
              echo "### Production Migration Dry-Run Skipped"
              echo ""
              echo "Configure \`SUPABASE_ACCESS_TOKEN\` and \`SUPABASE_DB_PASSWORD\` repository secrets to enable \`supabase db push --dry-run\` against \`${SUPABASE_PROJECT_ID:-ydnylydulwjecdllbnev}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Skipping production dry-run because SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set."
            exit 0
          fi

          project_ref="${SUPABASE_PROJECT_ID:-ydnylydulwjecdllbnev}"
          supabase link --project-ref "$project_ref" --password "$SUPABASE_DB_PASSWORD"
          dry_run_output=$(supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD")
          {
            echo "### Production Migration Dry-Run (\`${project_ref}\`)"
            echo ""
            echo '```text'
            echo "$dry_run_output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Local Supabase Stack
        if: always()
        run: supabase stop --no-backup || true

  deploy-production-migrations:
    name: Deploy Migrations to Production DB
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Push Pending Migrations to Production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets are required for production migration deployment."
            exit 1
          fi

          project_ref="${SUPABASE_PROJECT_ID:-ydnylydulwjecdllbnev}"
          supabase link --project-ref "$project_ref" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --yes --password "$SUPABASE_DB_PASSWORD"
