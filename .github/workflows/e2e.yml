name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional external base URL (e.g., Vercel preview/staging). Leave empty to build and run in simulation mode.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E (Chromium & Mobile Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build App (Simulation Mode)
        if: ${{ inputs.base_url == '' }}
        env:
          VITE_SUPABASE_URL: https://placeholder-url.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_OTEL_ENABLED: 'false'
        run: npm run build:e2e

      - name: Run Playwright E2E Tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
          PLAYWRIGHT_SKIP_BUILD: '1'
          VITE_SUPABASE_URL: https://placeholder-url.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_OTEL_ENABLED: 'false'
        run: npx playwright test

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright Traces & Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
