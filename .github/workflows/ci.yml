name: Integration & Safeguards CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # Runs weekly on Monday mornings to detect drift

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for committing the scorecard badge & report
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm audit --audit-level=critical

      - name: Check Formatting
        run: npx prettier --check .

      - name: Run Linter (Oxlint & ESLint)
        run: npx oxlint && npx eslint .

      - name: Run TypeScript Compile & Build
        run: npm run build

      - name: Run Tests with Coverage
        run: npx vitest run --coverage

      - name: Test reconciliation with local PostgreSQL
        run: npm run test:postgres

      - name: Stale Documentation Detection
        run: |
          echo "Scanning for TODO and FIXME tags..."
          grep -rn "TODO\|FIXME\|HACK" src/ || true

      - name: Verify Documentation Sync
        run: |
          echo "Verifying AGENTS.md sync..."
          diff -q AGENTS.md ARCHITECTURE.md || true

      - name: Run AI Harness Scorecard
        uses: markmishaev76/ai-harness-scorecard@v1
        id: scorecard
        with:
          format: markdown
          output-file: scorecard-report.md
          badge-file: scorecard-badge.json

      - name: Commit Scorecard Badge and Report
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scorecard-badge.json scorecard-report.md
          git diff --cached --quiet || (git commit -m "chore: update scorecard badge and report" && git push)

  e2e:
    name: E2E (Playwright)
    # Job independiente: corre en paralelo a build-and-test y no necesita secretos,
    # porque la app se levanta en Modo Simulación (ver playwright.config.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
