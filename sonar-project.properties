# SonarQube/SonarCloud Project Configuration
sonar.organization=enoc31
sonar.projectKey=ong-donation-audit
sonar.projectName=ONG Donation Audit
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io

# Path to sources and tests
sonar.sources=src
sonar.tests=src

# Inclusions and exclusions
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx,src/setupTests.ts,node_modules/**,dist/**,coverage/**,.vercel/**
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.spec.ts,src/**/*.spec.tsx

# Source encoding
sonar.sourceEncoding=UTF-8

# TypeScript environment settings
sonar.javascript.environments=browser
sonar.typescript.tsconfigPath=tsconfig.app.json

# Quality reports (Vitest output paths)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.junit.reportPaths=coverage/junit.xml
